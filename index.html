<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Majestic Radio PRO+</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f0a1f;
  color:#fff;
  display:flex;
  justify-content:center;
}

.app {
  width:100%;
  max-width:420px;
  padding:15px;
}

.cover {
  width:100%;
  aspect-ratio:1;
  border-radius:16px;
  background:#222;
  background-size:cover;
  background-position:center;
  margin-bottom:10px;
  transition:.4s;
}

.title { font-size:20px; font-weight:bold; }
.artist { opacity:.7; margin-bottom:10px; }

.controls button {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#6d28d9;
  color:#fff;
}

.stations, .history {
  margin-top:15px;
}

.item {
  padding:10px;
  background:#1c1433;
  border-radius:10px;
  margin-bottom:5px;
  cursor:pointer;
}

.item.active { background:#6d28d9; }

.fav { float:right; cursor:pointer; }

.volume {
  width:100%;
}
</style>

</head>
<body>

<div class="app">

<div id="cover" class="cover"></div>
<div id="title">—</div>
<div id="artist">—</div>

<div class="controls">
  <button onclick="prev()">◀</button>
  <button onclick="toggle()">Play</button>
  <button onclick="next()">▶</button>
</div>

<input type="range" min="0" max="1" step="0.01" id="volume" class="volume">

<h3>📻 Станции</h3>
<div id="stations" class="stations"></div>

<h3>🎶 История</h3>
<div id="history" class="history"></div>

</div>

<audio id="audio"></audio>

<script>
const BASE = "https://majesticradio.duckdns.org";

const STATIONS = {
  liquid_drum: { name:"Liquid Drum", stream:"/listen/liquid_drum/liquiddrum.mp3" },
  drum_bass: { name:"Drum & Bass", stream:"/listen/drum_bass/drumnbass.mp3" },
  psy_chill: { name:"Psy Chill", stream:"/listen/psy_chill/psychill.mp3" },
  old_goa: { name:"Old Goa", stream:"/listen/old_goa/oldgoa.mp3" },
  progressive_psytrance: { name:"Progressive Psy", stream:"/listen/progressive_psytrance/psyprog.mp3" },
  psy_tech: { name:"Psy Tech", stream:"/listen/psy_tech/psytech.mp3" },
  dark_room: { name:"Dark Room", stream:"/listen/dark_room/darkroot.mp3" }
};

const keys = Object.keys(STATIONS);

let index = 0;
let playing = false;
let lastSongId = null;
let interval = null;
let cache = {};
let favorites = JSON.parse(localStorage.getItem("fav") || "[]");

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const cover = document.getElementById("cover");
const stationsDiv = document.getElementById("stations");
const historyDiv = document.getElementById("history");
const volume = document.getElementById("volume");

volume.value = 0.7;
audio.volume = 0.7;

volume.oninput = () => audio.volume = volume.value;

function setCover(url) {
  if (!url) return;
  if (cache[url]) return cover.style.backgroundImage = `url(${url})`;

  const img = new Image();
  img.onload = () => {
    cache[url] = true;
    cover.style.backgroundImage = `url(${url})`;
  };
  img.src = url;
}

function renderStations() {
  stationsDiv.innerHTML = "";
  keys.forEach((k,i)=>{
    const div = document.createElement("div");
    div.className = "item " + (i===index ? "active":"");

    const fav = favorites.includes(k) ? "❤️" : "🤍";

    div.innerHTML = STATIONS[k].name + 
      `<span class="fav">${fav}</span>`;

    div.onclick = () => {
      index = i;
      loadStation();
      if (playing) play();
      renderStations();
    };

    div.querySelector(".fav").onclick = (e)=>{
      e.stopPropagation();
      toggleFav(k);
    };

    stationsDiv.appendChild(div);
  });
}

function toggleFav(k){
  if (favorites.includes(k))
    favorites = favorites.filter(x=>x!==k);
  else
    favorites.push(k);

  localStorage.setItem("fav", JSON.stringify(favorites));
  renderStations();
}

function renderHistory(list) {
  historyDiv.innerHTML = "";
  list.slice(0,5).forEach(s=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = s.song.artist + " - " + s.song.title;
    historyDiv.appendChild(div);
  });
}

async function fetchNowPlaying() {
  const key = keys[index];

  try {
    const res = await fetch(`${BASE}/api/nowplaying/${key}?t=${Date.now()}`);
    const data = await res.json();

    const song = data?.now_playing?.song;
    if (!song) return;

    if (song.id === lastSongId) return;
    lastSongId = song.id;

    title.innerText = song.title || "Unknown";
    artist.innerText = song.artist || "Unknown";

    let art = song.art;
    if (art && !art.startsWith("http")) art = BASE + art;
    setCover(art);

    renderHistory(data.song_history || []);

  } catch(e) {}
}

function startUpdates() {
  clearInterval(interval);
  interval = setInterval(fetchNowPlaying, 5000);
}

function loadStation() {
  const key = keys[index];
  audio.src = BASE + STATIONS[key].stream + "?t=" + Date.now();
  lastSongId = null;
  fetchNowPlaying();
}

function play() {
  audio.play();
  playing = true;
  startUpdates();
}

function stop() {
  audio.pause();
  playing = false;
  clearInterval(interval);
}

function toggle() {
  playing ? stop() : (loadStation(), play());
}

function next() {
  index = (index+1)%keys.length;
  loadStation();
  if (playing) play();
  renderStations();
}

function prev() {
  index = (index-1+keys.length)%keys.length;
  loadStation();
  if (playing) play();
  renderStations();
}

// init
renderStations();
loadStation();
</script>

</body>
</html>
