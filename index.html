<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Majestic Radio</title>
<style>
  body {
    background: #121212;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  .player {
    margin-top: 50px;
  }

  img {
    width: 250px;
    height: 250px;
    object-fit: cover;
    border-radius: 12px;
    transition: opacity 0.4s ease;
  }

  .track {
    margin-top: 15px;
    font-size: 18px;
    color: #b3b3b3;
  }

  .title {
    color: #fff;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="player">
  <img id="cover" src="" alt="cover">
  <div class="track">
    <div id="artist">...</div>
    <div id="title" class="title">...</div>
  </div>
</div>

<script>
const API = "https://majesticradio.duckdns.org/api/nowplaying";
const STATION_ID = 6; // меняй если нужно

let lastTrackId = null;

async function updatePlayer() {
  try {
    const res = await fetch(API);
    const data = await res.json();

    const station = data.find(s => s.station.id === STATION_ID);
    if (!station) return;

    const song = station.now_playing.song;
    if (!song) return;

    // если трек не изменился — ничего не делаем (как Spotify)
    if (song.id === lastTrackId) return;
    lastTrackId = song.id;

    const cover = document.getElementById("cover");
    const artist = document.getElementById("artist");
    const title = document.getElementById("title");

    // плавное скрытие
    cover.style.opacity = 0;

    setTimeout(() => {
      cover.src = song.art || "https://via.placeholder.com/250?text=No+Cover";
      artist.textContent = song.artist || "Unknown Artist";
      title.textContent = song.title || "Unknown Track";

      // плавное появление
      cover.style.opacity = 1;
    }, 200);

  } catch (e) {
    console.error("API error:", e);
  }
}

// первый запуск
updatePlayer();

// обновление каждые 5 секунд
setInterval(updatePlayer, 5000);
</script>

</body>
</html>
