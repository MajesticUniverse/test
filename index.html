<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Majestic Radio PRO+ — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  background:#07060b;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
  position:relative;
}

.bg-gradient{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 30% 40%,#1a0a3e 0%,transparent 50%),
             radial-gradient(ellipse at 70% 60%,#2d1b69 0%,transparent 50%),
             radial-gradient(ellipse at 50% 90%,#0f1a3a 0%,transparent 50%);
  animation:bgShift 12s ease-in-out infinite alternate;
}
@keyframes bgShift{0%{opacity:.5;transform:scale(1)}100%{opacity:1;transform:scale(1.15)}}

.particles{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.particle{
  position:absolute;width:2px;height:2px;
  background:rgba(139,92,246,.4);border-radius:50%;
  animation:float linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{transform:translateY(-10vh) scale(1);opacity:0;}
}

.container{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  gap:24px;
  max-width:440px;width:100%;
  padding:20px;
}

.logo{
  text-align:center;
  animation:fadeDown .8s ease;
}
.logo h1{
  font-size:28px;font-weight:900;
  background:linear-gradient(135deg,#c084fc,#8b5cf6,#6366f1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;
}
.logo span{
  display:block;font-size:11px;font-weight:600;
  letter-spacing:2px;color:rgba(255,255,255,.3);margin-top:4px;
}

.card{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:28px 24px;
  box-shadow:0 25px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05) inset;
  width:100%;
  position:relative;
  overflow:hidden;
  animation:fadeUp .9s ease;
}
.card::before{
  content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,92,246,.6),transparent);
}

.cover-wrap{
  position:relative;width:100%;aspect-ratio:1;
  border-radius:20px;overflow:hidden;margin-bottom:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}
.cover-img{
  width:100%;height:100%;
  background:linear-gradient(135deg,#1a1035,#2a1555,#1a1035);
  background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;
}
.cover-img svg{opacity:.3;}
.badge{
  position:absolute;top:12px;left:12px;
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;
  background:rgba(0,0,0,.6);backdrop-filter:blur(10px);
  border-radius:20px;font-size:11px;font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;
}
.badge-dot{width:6px;height:6px;background:#ef4444;border-radius:50%;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.station-label{
  text-align:center;font-size:11px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(139,92,246,.8);margin-bottom:6px;
}
.song-title{
  text-align:center;font-size:20px;font-weight:700;
  background:linear-gradient(135deg,#fff,#c4b5fd);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.song-artist{
  text-align:center;font-size:14px;color:rgba(255,255,255,.5);margin-bottom:16px;
}

.visualizer{
  display:flex;align-items:flex-end;justify-content:center;gap:3px;height:32px;margin-bottom:20px;
}
.vbar{
  width:4px;border-radius:2px;
  background:linear-gradient(to top,#8b5cf6,#a78bfa);
  animation:barBounce .8s ease-in-out infinite alternate;
}
@keyframes barBounce{0%{height:4px}100%{height:var(--h,24px)}}

.controls{
  display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;
}
.cbtn{
  width:48px;height:48px;border:none;border-radius:14px;
  background:rgba(255,255,255,.06);color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
  border:1px solid rgba(255,255,255,.06);
}
.cbtn:hover{background:rgba(255,255,255,.12);transform:scale(1.05);}
.cbtn:active{transform:scale(.95);}
.cbtn.play{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#7c3aed);
  font-size:24px;box-shadow:0 8px 30px rgba(139,92,246,.4);border:none;
}
.cbtn.play:hover{background:linear-gradient(135deg,#a78bfa,#8b5cf6);box-shadow:0 8px 40px rgba(139,92,246,.6);}

.volume-wrap{display:flex;align-items:center;gap:10px;padding:0 4px;margin-bottom:0;}
.vol-icon{font-size:16px;opacity:.5;flex-shrink:0;}
.vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:4px;background:rgba(255,255,255,.1);border-radius:2px;outline:none;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;
  background:#8b5cf6;border-radius:50%;
  box-shadow:0 0 10px rgba(139,92,246,.5);cursor:pointer;
}

.section{
  margin-top:16px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:16px;width:100%;
  animation:fadeUp 1s ease;
}
.section-title{
  font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:rgba(255,255,255,.4);margin-bottom:12px;padding-left:4px;
}
.st-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:12px;
  cursor:pointer;transition:all .2s;border:1px solid transparent;
}
.st-item:hover{background:rgba(255,255,255,.05);}
.st-item.active{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.2);}
.st-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);flex-shrink:0;transition:all .3s;}
.st-item.active .st-dot{background:#8b5cf6;box-shadow:0 0 8px rgba(139,92,246,.6);}
.st-name{font-size:14px;font-weight:500;color:rgba(255,255,255,.7);flex:1;}
.st-item.active .st-name{color:#fff;}
.st-fav{font-size:16px;cursor:pointer;opacity:.4;transition:opacity .2s;}
.st-fav:hover{opacity:1;}

.h-item{
  padding:10px 12px;border-radius:12px;
  background:rgba(255,255,255,.03);margin-bottom:6px;
  font-size:13px;color:rgba(255,255,255,.5);
  display:flex;align-items:center;gap:8px;
}
.h-item .dot{width:4px;height:4px;background:rgba(139,92,246,.4);border-radius:50%;flex-shrink:0;}

@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:460px){
  .container{padding:12px;gap:16px;}
  .card{padding:20px 16px;border-radius:24px;}
  .song-title{font-size:18px;}
}
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="particles" id="particles"></div>

<div class="container">

  <div class="logo">
    <h1>Majestic Radio</h1>
    <span>PRO+ EDITION</span>
  </div>

  <div class="card">
    <div class="cover-wrap">
      <div class="cover-img" id="cover">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div class="badge"><span class="badge-dot"></span>LIVE</div>
    </div>

    <div class="station-label">Liquid Drum</div>
    <div class="song-title">Midnight Dreams</div>
    <div class="song-artist">Aether Pulse</div>

    <div class="visualizer" id="visualizer"></div>

    <div class="controls">
      <button class="cbtn" title="Предыдущая">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="cbtn play" title="Play/Pause">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="cbtn" title="Следующая">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="volume-wrap">
      <span class="vol-icon">🔊</span>
      <input type="range" class="vol-slider" value="70" min="0" max="100">
    </div>
  </div>

  <div class="section">
    <div class="section-title">📻 Станции</div>
    <div id="stationList"></div>
  </div>

  <div class="section">
    <div class="section-title">🎶 История треков</div>
    <div id="historyList"></div>
  </div>

</div>

<script>
const STATIONS = [
  { name:"Liquid Drum", key:"liquid_drum", active:true },
  { name:"Drum & Bass", key:"drum_bass" },
  { name:"Psy Chill", key:"psy_chill" },
  { name:"Old Goa", key:"old_goa" },
  { name:"Progressive Psy", key:"progressive_psytrance" },
  { name:"Psy Tech", key:"psy_tech" },
  { name:"Dark Room", key:"dark_room" }
];

const HISTORY = [
  { artist:"Aether Pulse", title:"Midnight Dreams" },
  { artist:"Liquid State", title:"Ocean Waves" },
  { artist:"Deep Current", title:"Floating" },
  { artist:"Nebula Sound", title:"Starlight Echoes" },
  { artist:"Crystal Method", title:"Neon Rain" }
];

// Visualizer
const visEl = document.getElementById("visualizer");
for(let i=0;i<32;i++){
  const b = document.createElement("div");
  b.className = "vbar";
  const h = 6 + Math.random()*26;
  b.style.setProperty("--h", h+"px");
  b.style.animationDelay = (Math.random()*.5)+"s";
  b.style.animationDuration = (.6+Math.random()*.4)+"s";
  visEl.appendChild(b);
}

// Station list
const stEl = document.getElementById("stationList");
STATIONS.forEach((s,i)=>{
  const el = document.createElement("div");
  el.className = "st-item" + (s.active ? " active" : "");
  el.innerHTML = `<span class="st-dot"></span><span class="st-name">${s.name}</span><span class="st-fav">${s.active ? "❤️" : "🤍"}</span>`;
  stEl.appendChild(el);
});

// History
const hEl = document.getElementById("historyList");
HISTORY.forEach(h=>{
  const el = document.createElement("div");
  el.className = "h-item";
  el.innerHTML = `<span class="dot"></span>${h.artist} — ${h.title}`;
  hEl.appendChild(el);
});

// Particles
const pc = document.getElementById("particles");
for(let i=0;i<30;i++){
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random()*100+"%";
  p.style.animationDuration = (8+Math.random()*12)+"s";
  p.style.animationDelay = (Math.random()*10)+"s";
  const sz = 1+Math.random()*3;
  p.style.width = p.style.height = sz+"px";
  pc.appendChild(p);
}

// Interactive: click play toggles visualizer speed
const playBtn = document.querySelector(".cbtn.play");
let isPlaying = true;
playBtn.addEventListener("click", ()=>{
  isPlaying = !isPlaying;
  playBtn.innerHTML = isPlaying
    ? '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
    : '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  document.querySelectorAll(".vbar").forEach(b=>{
    b.style.animationPlayState = isPlaying ? "running" : "paused";
  });
});
</script>
</body>
</html>
