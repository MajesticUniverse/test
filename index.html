<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Majestic Radio</title>

<style>
body { background:#111; color:#fff; font-family:sans-serif; text-align:center; }
.cover { width:250px; height:250px; margin:20px auto; background:#333; background-size:cover; }
</style>

</head>

<body>

<h1>Majestic Radio</h1>

<div id="cover" class="cover"></div>
<h2 id="title">—</h2>
<p id="artist">—</p>

<audio id="audio" controls></audio>

<script>
const BASE_URL = "https://majesticradio.duckdns.org";
const audio = document.getElementById("audio");
const cover = document.getElementById("cover");
const titleEl = document.getElementById("title");
const artistEl = document.getElementById("artist");

let currentStation = "liquid_drum";
let lastTrackId = "";
let currentArt = "";

// старт
audio.src = BASE_URL + "/listen/liquid_drum/liquiddrum.mp3";
audio.play();

setInterval(fetchMetadata, 5000);

async function fetchMetadata() {
    try {
        const res = await fetch(`${BASE_URL}/api/nowplaying/${currentStation}?r=${Math.random()}`);
        const data = await res.json();

        const song = data.now_playing.song;

        let title = song.title || "";
        let artist = song.artist || "";

        // если приходит строкой "Artist - Title"
        if (!artist && title.includes(" - ")) {
            const parts = title.split(" - ");
            artist = parts[0];
            title = parts.slice(1).join(" - ");
        }

        const trackId = artist + "_" + title;

        // обновляем только если новый трек
        if (trackId !== lastTrackId) {
            lastTrackId = trackId;

            // плавная смена текста
            titleEl.style.opacity = 0;
            artistEl.style.opacity = 0;

            setTimeout(() => {
                titleEl.textContent = title || "Unknown";
                artistEl.textContent = artist || "Unknown";

                titleEl.style.opacity = 1;
                artistEl.style.opacity = 1;
            }, 150);

            // обновление обложки без мигания
            let art = song.art || "";
            if (art && !art.startsWith("http")) {
                art = BASE_URL + art;
            }

            if (art && art !== currentArt) {
                currentArt = art;

                const img = new Image();
                img.onload = () => {
                    cover.style.backgroundImage = `url(${art})`;
                };
                img.src = art;
            }
        }

    } catch(e) {
        console.log("error", e);
    }
}
</script>

</body>
</html>
